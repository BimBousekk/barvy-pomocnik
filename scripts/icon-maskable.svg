<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Maskable: bezpečná zóna je vnitřních ~80 % (kružnice o průměru 819 px).
       Vše důležité musí být uvnitř, OS osekne zbytek do svého tvaru. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1a1a1d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="dot" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFE34D"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background, žádné zaoblení (OS si udělá vlastní tvar) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- White annulus between outer and inner ring -->
  <circle cx="512" cy="512" r="171.5"
          fill="none" stroke="#ffffff" stroke-width="107"/>

  <!-- Crosshair zmenšený, aby seděl do 80% safe zone -->
  <circle cx="512" cy="512" r="240"
          fill="none" stroke="#FFD60A" stroke-width="30"
          opacity="0.95"/>
  <circle cx="512" cy="512" r="112"
          fill="none" stroke="#FFD60A" stroke-width="12"
          opacity="0.5"/>
  <circle cx="512" cy="512" r="50" fill="url(#dot)"/>
  <ellipse cx="501" cy="495" rx="22" ry="14" fill="#ffffff" opacity="0.35"/>
</svg>
